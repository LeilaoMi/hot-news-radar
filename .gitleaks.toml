# gitleaks config, read automatically by the shared Security workflow
# (LeilaoMi/security-workflows). Keep [extend] useDefault = true:
# without it the default rules are replaced and nothing is detected.

[extend]
useDefault = true

[allowlist]
# The Bearer token used by tests/test_mcp_security.py is a test
# fixture, not a credential: it lives only in that test file (in
# all of history), is exercised 17 times against an in-process
# TestClient with no network, and its value is synthetic
# ("test" embedded, 10-digit tail). A stopword (exact value)
# suppresses only findings containing this exact string; a real
# secret is still flagged. The value is already public in the
# repo, so listing it here as a stopword exposes nothing new.
stopwords = ["t0ken-for-tests-0123456789"]
