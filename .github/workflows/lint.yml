name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # 规则集见 pyproject.toml [tool.ruff]（宽松起步，渐进收紧）
      - name: Run ruff
        run: ruff check .

      # pyproject 的 exclude 含 scripts/（CI 关键逻辑所在）；显式传入路径时 exclude 不生效，
      # 这里单独把 scripts/ 纳入 lint（审计 4.10）
      - name: Run ruff on scripts/
        run: ruff check scripts
