name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # 规则集见 pyproject.toml [tool.ruff]（宽松起步，渐进收紧）
      - name: Run ruff
        run: ruff check .

      # pyproject 的 exclude 含 scripts/（CI 关键逻辑所在）；显式传入路径时 exclude 不生效，
      # 这里单独把 scripts/ 纳入 lint（审计 4.10）
      - name: Run ruff on scripts/
        run: ruff check scripts
