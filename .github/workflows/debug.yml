name: Debug Secrets (one-off v2)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  a-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          K: ${{ secrets.AI_API_KEY }}
        run: |
          echo "A baseline: len=${#K} head=${K:0:5}"

  b-crawler-perms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    concurrency:
      group: crawler-debug-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: check
        env:
          K: ${{ secrets.AI_API_KEY }}
        run: |
          echo "B perms+conc+timeout: len=${#K} head=${K:0:5}"

  c-big-env:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          echo "C big-env: K len=${#AI_API_KEY} head=${AI_API_KEY:0:5}"
          echo "C big-env: MODEL len=${#AI_MODEL} BASE len=${#AI_API_BASE} ENABLED=[$AI_ANALYSIS_ENABLED]"

  d-uv-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: check via uv run
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          shell_len=${#AI_API_KEY}
          uv run --no-project python -c "import os; v=os.environ.get('AI_API_KEY',''); print('D uv-run python len:', len(v), 'head:', v[:5])"
          echo "D shell len=$shell_len"
