[project]
name = "trendradar"
version = "6.10.0"
description = "TrendRadar - 热点新闻聚合与分析工具"
requires-python = ">=3.12"
dependencies = [
    "requests==2.33.0",
    "pytz==2026.1",
    "PyYAML==6.0.3",
    "fastmcp==2.12.5",
    "websockets==13.1",
    "feedparser==6.0.12",
    "boto3==1.42.76",
    "litellm==1.82.6",
    "json-repair==0.58.6",
    "tenacity==8.5.0",
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 存储层会打印连接日志，默认捕获不影响断言
log_cli_level = "WARNING"
addopts = "-q --strict-markers"
markers = [
    "slow: 耗时较长的测试（默认不跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["docs", "output", "scripts"]

[tool.ruff.lint]
# 宽松起步：pyflakes 全量（未用导入/未定义名/格式化占位错误等）+ 少量 pycodestyle。
# 后续可渐进加入 "I"（isort）、"B"（bugbear）、"UP"（pyupgrade）。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试夹具允许未使用导入
"tests/*" = ["F401"]
